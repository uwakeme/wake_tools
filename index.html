<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wake Tools · 开发者工具集</title>
  <meta name="description" content="为开发者准备的小工具集合：时间戳转换、JSON 格式化、Base64、UUID、颜色转换等。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       基础变量 & 主题
       ============================================================ */
    :root {
      /* 颜色 - 浅色 */
      --bg: #fafbfc;
      --bg-elev: #ffffff;
      --bg-hover: #f3f5f8;
      --bg-active: #eef4ff;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-active: #1e40af;
      --primary-soft: #dbeafe;
      --primary-softer: #eff6ff;
      --success: #10b981;
      --success-soft: #d1fae5;
      --warning: #f59e0b;
      --warning-soft: #fef3c7;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --code-bg: #f8fafc;
      --code-border: #e2e8f0;

      /* 字体 */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace;

      /* 阴影 */
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, .06), 0 1px 2px rgba(15, 23, 42, .04);
      --shadow-md: 0 4px 6px rgba(15, 23, 42, .05), 0 2px 4px rgba(15, 23, 42, .04);
      --shadow-lg: 0 10px 20px rgba(15, 23, 42, .08), 0 4px 8px rgba(15, 23, 42, .04);
      --shadow-xl: 0 20px 40px rgba(15, 23, 42, .10), 0 8px 16px rgba(15, 23, 42, .06);

      /* 圆角 */
      --radius-sm: 6px;
      --radius: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-2xl: 20px;

      /* 间距 */
      --sidebar-width: 264px;
      --topbar-height: 60px;

      /* 过渡 */
      --transition: 200ms cubic-bezier(0.16, 1, 0.3, 1);
      --transition-fast: 150ms cubic-bezier(0.16, 1, 0.3, 1);
      --transition-slow: 300ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg: #0a0e14;
      --bg-elev: #121821;
      --bg-hover: #1a2030;
      --bg-active: #1e2a44;
      --text: #e6edf3;
      --text-secondary: #a1adc1;
      --text-muted: #6e7681;
      --border: #1f2937;
      --border-strong: #374151;
      --primary: #60a5fa;
      --primary-hover: #93c5fd;
      --primary-soft: #1e3a5f;
      --primary-softer: #172033;
      --success: #34d399;
      --success-soft: #064e3b;
      --warning: #fbbf24;
      --warning-soft: #78350f;
      --danger: #f87171;
      --danger-soft: #7f1d1d;
      --code-bg: #0d1117;
      --code-border: #1f2937;
      --shadow-xs: 0 1px 2px rgba(0,0,0,.4);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 4px 6px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.3);
      --shadow-lg: 0 10px 20px rgba(0,0,0,.5), 0 4px 8px rgba(0,0,0,.3);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }

    code, pre, .mono { font-family: var(--font-mono); }
    code { font-size: 0.9em; }

    /* 选区颜色 */
    ::selection { background: var(--primary-soft); color: var(--primary-active); }
    [data-theme="dark"] ::selection { background: var(--primary-soft); color: var(--text); }

    /* 通用焦点环 */
    *:focus { outline: none; }
    *:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ============================================================
       布局
       ============================================================ */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-elev);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform var(--transition);
    }

    .sidebar-header {
      padding: 22px 18px 18px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .logo-icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
      border-radius: var(--radius);
      color: #fff;
      box-shadow: 0 2px 6px rgba(37, 99, 235, .25);
    }
    .logo-icon svg { width: 18px; height: 18px; stroke-width: 2.2; }

    .search-box {
      margin: 14px 14px 4px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all var(--transition);
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box input:focus {
      border-color: var(--primary);
      background: var(--bg-elev);
      box-shadow: 0 0 0 3px var(--primary-softer);
    }

    .search-box svg {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      width: 14px; height: 14px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 20px;
    }

    .nav-group { margin-top: 14px; }

    .nav-group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 6px 12px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      transition: all var(--transition-fast);
      user-select: none;
      text-decoration: none;
      position: relative;
    }

    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--primary-softer);
      color: var(--primary);
      font-weight: 600;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: -10px; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 16px;
      background: var(--primary);
      border-radius: 0 2px 2px 0;
    }

    .nav-item svg {
      width: 16px; height: 16px;
      flex-shrink: 0;
      stroke-width: 2;
    }

    /* 主内容区 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--topbar-height);
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-elev) 80%, transparent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .menu-btn {
      display: none;
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text-secondary);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
    }
    .menu-btn:hover { background: var(--bg-hover); color: var(--text); }

    .breadcrumb {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .breadcrumb strong { color: var(--text); font-weight: 600; }
    .breadcrumb .crumb-sep { color: var(--text-muted); margin: 0 6px; }

    .topbar-actions { display: flex; gap: 6px; }

    .icon-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text-secondary);
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      text-decoration: none;
    }
    .icon-btn svg { width: 16px; height: 16px; }
    .icon-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-softer);
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 28px 60px;
    }

    .tool-panel { max-width: 1100px; margin: 0 auto; }

    .tool-header { margin-bottom: 28px; }

    .tool-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tool-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      background: var(--primary-softer);
      color: var(--primary);
      border-radius: var(--radius);
    }
    .tool-title-icon svg { width: 20px; height: 20px; stroke-width: 2; }

    .tool-desc {
      color: var(--text-secondary);
      font-size: 14px;
      margin: 0;
      max-width: 720px;
    }

    /* 通用 UI 元素 */
    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow-xs);
      transition: box-shadow var(--transition);
    }
    .panel:hover { box-shadow: var(--shadow-sm); }

    .panel + .panel { margin-top: 16px; }

    .panel-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title svg { width: 14px; height: 14px; opacity: .6; }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input, .textarea, .select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all var(--transition);
    }
    .input::placeholder, .textarea::placeholder { color: var(--text-muted); }
    .input:hover, .textarea:hover, .select:hover { border-color: var(--border-strong); }
    .input:focus, .textarea:focus, .select:focus {
      border-color: var(--primary);
      background: var(--bg-elev);
      box-shadow: 0 0 0 3px var(--primary-softer);
    }

    .textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }

    .input.mono, .textarea.mono { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: -0.01em; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
      user-select: none;
    }
    .btn svg { width: 14px; height: 14px; stroke-width: 2.2; }
    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-softer);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 1px 2px rgba(37, 99, 235, .15);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, .3);
    }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-ghost:hover { background: var(--bg-hover); border-color: transparent; color: var(--text); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-block { width: 100%; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .switch input { display: none; }
    .switch-track {
      width: 36px; height: 20px;
      background: var(--border-strong);
      border-radius: 999px;
      position: relative;
      transition: background var(--transition);
      flex-shrink: 0;
    }
    .switch-track::after {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      top: 2px; left: 2px;
      transition: transform var(--transition);
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .switch input:checked + .switch-track { background: var(--primary); }
    .switch input:checked + .switch-track::after { transform: translateX(16px); }
    .switch-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }

    .checkbox-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      background: var(--bg-elev);
      transition: all var(--transition-fast);
    }
    .chip input { display: none; }
    .chip:hover { border-color: var(--primary); }
    .chip.active {
      background: var(--primary-softer);
      border-color: var(--primary);
      color: var(--primary);
    }

    .output {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.65;
      letter-spacing: -0.01em;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 44px;
      max-height: 480px;
      overflow: auto;
      color: var(--text);
    }
    .output.empty { color: var(--text-muted); font-style: italic; }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg-elev);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all var(--transition);
      z-index: 1000;
      box-shadow: var(--shadow-lg);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .toast svg { width: 16px; height: 16px; stroke-width: 2.4; }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    [data-theme="dark"] .toast { background: var(--text); color: var(--bg); }

    .color-swatch {
      width: 48px; height: 48px;
      border-radius: var(--radius);
      border: 1px solid var(--code-border);
      flex-shrink: 0;
    }

    /* 文本 diff */
    .diff-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .diff-pane {
      border: 1px solid var(--code-border);
      border-radius: var(--radius);
      background: var(--code-bg);
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.7;
      padding: 14px 16px;
      max-height: 500px;
      overflow: auto;
    }
    .diff-line {
      padding: 1px 6px;
      border-radius: 3px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 1px -6px;
    }
    .diff-line.add { background: var(--success-soft); color: var(--success); }
    .diff-line.del { background: var(--danger-soft); color: var(--danger); }
    .diff-line.same { color: var(--text-secondary); }
    .diff-line.marker { background: transparent; color: var(--text-muted); }

    /* Cron 表格 */
    .cron-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .cron-table th, .cron-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .cron-table th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .cron-table tr:last-child td { border-bottom: none; }
    .cron-table td:first-child { font-weight: 600; }

    /* ASCII 表 */
    .ascii-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 6px;
      max-height: 480px;
      overflow-y: auto;
      padding: 4px;
    }
    .ascii-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--bg-elev);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .ascii-cell:hover {
      border-color: var(--primary);
      background: var(--primary-softer);
      transform: translateY(-1px);
    }
    .ascii-cell .char { font-size: 16px; font-weight: 600; color: var(--text); }
    .ascii-cell .code { color: var(--text-muted); font-size: 10px; margin-top: 2px; }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      background: var(--primary-softer);
      color: var(--primary);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }
    .tag.success { background: var(--success-soft); color: var(--success); }
    .tag.warning { background: var(--warning-soft); color: var(--warning); }
    .tag.danger { background: var(--danger-soft); color: var(--danger); }

    .home-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .home-card {
      padding: 20px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }
    .home-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary-softer) 0%, transparent 60%);
      opacity: 0;
      transition: opacity var(--transition);
      pointer-events: none;
    }
    .home-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .home-card:hover::before { opacity: 1; }
    .home-card-icon {
      width: 40px; height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-softer);
      color: var(--primary);
      border-radius: var(--radius);
      transition: all var(--transition);
    }
    .home-card-icon svg { width: 20px; height: 20px; stroke-width: 2; }
    .home-card:hover .home-card-icon {
      background: var(--primary);
      color: #fff;
      transform: scale(1.05);
    }
    .home-card h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      position: relative;
    }
    .home-card p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 12.5px;
      line-height: 1.5;
      position: relative;
    }
    .home-card .home-card-arrow {
      position: absolute;
      top: 20px; right: 20px;
      color: var(--text-muted);
      opacity: 0;
      transform: translateX(-4px);
      transition: all var(--transition);
    }
    .home-card:hover .home-card-arrow {
      opacity: 1;
      transform: translateX(0);
      color: var(--primary);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }
    .stat {
      padding: 14px 16px;
      background: var(--bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      transition: all var(--transition);
    }
    .stat:hover { border-color: var(--border-strong); }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }

    /* 移动端 */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
        box-shadow: var(--shadow-xl);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .menu-btn svg { width: 18px; height: 18px; }
      .topbar { padding: 0 16px; }
      .content { padding: 20px 16px 40px; }
      .tool-title { font-size: 20px; }
      .row, .row-3, .diff-container { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .home-grid { grid-template-columns: 1fr; }
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 5px;
      border: 2px solid var(--bg-elev);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <script>

      cron: IC('<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/>'),
      ascii: IC('<path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/>'),

    /* ============================================================
       工具注册表
       ============================================================ */
    const TOOLS = [
      // 编码转换
      { id: 'base64', group: '编码转换', icon: 'base64', name: 'Base64 编解码',
        desc: '字符串与 Base64 互转，支持 UTF-8 中文。' },

      { id: 'unicode', group: '编码转换', icon: 'unicode', name: 'Unicode 编解码',
        desc: '中文字符与 \\uXXXX 转义互转。' },

      // 时间日期
      { id: 'timestamp', group: '时间日期', icon: 'timestamp', name: '时间戳转换',
        desc: 'Unix 时间戳与日期时间互转，支持秒/毫秒。' },

      // 格式化
      { id: 'json', group: '格式化', icon: 'json', name: 'JSON 格式化',
        desc: 'JSON 格式化、压缩、转义、校验。' },
      { id: 'sql', group: '格式化', icon: 'sql', name: 'SQL 格式化',
        desc: 'SQL 语句关键字大写、缩进美化。' },
      { id: 'xml', group: '格式化', icon: 'xml', name: 'XML 格式化',
        desc: 'XML 美化、压缩。' },

      // 文本处理
      { id: 'case', group: '文本处理', icon: 'case', name: '命名风格转换',
        desc: '驼峰、下划线、烤串、帕斯卡等命名互转，JSON Key 批处理。' },
      { id: 'textutil', group: '文本处理', icon: 'textutil', name: '文本去重 / 排序',
        desc: '按行去重、排序，统计行数与字符数。' },
      { id: 'diff', group: '文本处理', icon: 'diff', name: '文本 Diff',
        desc: '逐行比较两段文本的差异。' },
      { id: 'regex', group: '文本处理', icon: 'regex', name: '正则测试',
        desc: '实时测试正则表达式，支持捕获组高亮。' },

      // 生成器
      { id: 'uuid', group: '生成器', icon: 'uuid', name: 'UUID 生成',
        desc: '批量生成 UUID v4。' },
      { id: 'password', group: '生成器', icon: 'password', name: '随机密码',
        desc: '生成高强度随机密码，可选字符集与长度。' },
      { id: 'lorem', group: '生成器', icon: 'lorem', name: 'Lorem Ipsum',
        desc: '生成占位文本。' },

      // 颜色工具
      { id: 'color', group: '颜色工具', icon: 'color', name: '颜色值转换',
        desc: 'HEX / RGB / HSL 互转，附带色板预览。' },

      // 数字工具
      { id: 'radix', group: '数字工具', icon: 'radix', name: '进制转换',
        desc: '2~36 进制互转。' },

      // 其它
      { id: 'cron', group: '其它', icon: 'cron', name: 'Cron 表达式',
        desc: '解析 Cron 表达式，展示未来 5 次执行时间。' },
      { id: 'ascii', group: '其它', icon: 'ascii', name: 'ASCII 表',
        desc: '查询 ASCII / Unicode 字符。' },
    ];

    /* ============================================================
       工具实现
       ============================================================ */
    const Tools = {
      /* ---------- Base64 ---------- */
      base64() {
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">Base64 编解码</h1>
              <p class="tool-desc">字符串与 Base64 互转，自动处理 UTF-8 中文。</p>
            </div>
            <div class="row">
              <div class="panel">
                <div class="panel-title">原文（UTF-8）</div>
                <textarea class="textarea mono" id="b64in" placeholder="输入要编码的字符串…">Hello, 世界！</textarea>
                <div class="btn-row">
                  <button class="btn btn-primary" data-act="enc">编码 →</button>
                  <button class="btn" data-act="clear">清空</button>
                </div>
              </div>
              <div class="panel">
                <div class="panel-title">Base64 结果</div>
                <textarea class="textarea mono" id="b64out" placeholder="Base64 输出…"></textarea>
                <div class="btn-row">
                  <button class="btn btn-primary" data-act="dec">← 解码</button>
                  <button class="btn" data-act="copy">复制</button>
                </div>
              </div>
            </div>
          `,
          bind(root) {
            const $i = root.querySelector('#b64in');
            const $o = root.querySelector('#b64out');
            const enc = () => {
              try { $o.value = btoa(unescape(encodeURIComponent($i.value))); toast('已编码'); }
              catch (e) { toast('编码失败：' + e.message); }
            };
            const dec = () => {
              try { $i.value = decodeURIComponent(escape(atob($o.value.trim()))); toast('已解码'); }
              catch (e) { toast('解码失败：不是有效的 Base64'); }
            };
            root.addEventListener('click', e => {
              const a = e.target.dataset.act;
              if (a === 'enc') enc();
              else if (a === 'dec') dec();
              else if (a === 'clear') { $i.value = ''; $o.value = ''; }
              else if (a === 'copy') copyText($o.value);
            });
          }
        };
      },

      /* ---------- URL ---------- */
      url() {
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">URL 编解码</h1>
              <p class="tool-desc">支持 encodeURIComponent（推荐）和 encodeURI（整体 URL）两种模式。</p>
            </div>
            <div class="row">
              <div class="panel">
                <div class="panel-title">原文</div>
                <textarea class="textarea mono" id="urlin" placeholder="输入要编码的字符串…">https://example.com/search?q=你好&lang=中文</textarea>
                <div class="field" style="margin-top:12px;">
                  <label class="switch">
                    <input type="checkbox" id="urlmode" />
                    <span class="switch-track"></span>
                    <span class="switch-label">encodeURIComponent（更彻底）</span>
                  </label>
                </div>
                <div class="btn-row">
                  <button class="btn btn-primary" data-act="enc">编码 →</button>
                  <button class="btn" data-act="clear">清空</button>
                </div>
              </div>
              <div class="panel">
                <div class="panel-title">编码后</div>
                <textarea class="textarea mono" id="urlout" placeholder="结果…"></textarea>
                <div class="btn-row">
                  <button class="btn btn-primary" data-act="dec">← 解码</button>
                  <button class="btn" data-act="copy">复制</button>
                </div>
              </div>
            </div>
          `,
          bind(root) {
            const $i = root.querySelector('#urlin');
            const $o = root.querySelector('#urlout');
            const $m = root.querySelector('#urlmode');
            const enc = () => {
              $o.value = $m.checked ? encodeURIComponent($i.value) : encodeURI($i.value);
              toast('已编码');
            };
            const dec = () => {
              try { $i.value = $m.checked ? decodeURIComponent($o.value) : decodeURI($o.value); toast('已解码'); }
              catch (e) { toast('解码失败：' + e.message); }
            };
            root.addEventListener('click', e => {
              const a = e.target.dataset.act;
              if (a === 'enc') enc();
              else if (a === 'dec') dec();
              else if (a === 'clear') { $i.value = ''; $o.value = ''; }
              else if (a === 'copy') copyText($o.value);
            });
          }
        };
      },

      /* ---------- Hex ---------- */
      hex() {
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">Hex 字符串编解码</h1>
              <p class="tool-desc">文本与十六进制字符串互转（UTF-8 字节级）。</p>
            </div>
            <div class="row">
              <div class="panel">
                <div class="panel-title">文本</div>
                <textarea class="textarea mono" id="hexin" placeholder="输入文本…">Hi, 早上好</textarea>
                <div class="btn-row">
                  <button class="btn btn-primary" data-act="enc">转 Hex →</button>
                  <button class="btn" data-act="clear">清空</button>
                </div>
              </div>
              <div class="panel">
                <div class="panel-title">Hex</div>
                <textarea class="textarea mono" id="hexout" placeholder="hex 输出…"></textarea>
                <div class="btn-row">
                  <button class="btn btn-primary" data-act="dec">← 解码</button>
                  <button class="btn" data-act="copy">复制</button>
                </div>
              </div>
            </div>
          `,
          bind(root) {
            const $i = root.querySelector('#hexin');
            const $o = root.querySelector('#hexout');
            const enc = () => {
              const bytes = new TextEncoder().encode($i.value);
              $o.value = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' ');
              toast('已转 Hex');
            };
            const dec = () => {
              try {
                const clean = $o.value.replace(/\s+/g, '');
                if (clean.length % 2) throw new Error('长度必须为偶数');
                if (!/^[0-9a-fA-F]+$/.test(clean)) throw new Error('不是有效的 hex');
                const bytes = new Uint8Array(clean.match(/.{1,2}/g).map(s => parseInt(s, 16)));
                $i.value = new TextDecoder().decode(bytes);
                toast('已解码');
              } catch (e) { toast('解码失败：' + e.message); }
            };
            root.addEventListener('click', e => {
              const a = e.target.dataset.act;
              if (a === 'enc') enc();
              else if (a === 'dec') dec();
              else if (a === 'clear') { $i.value = ''; $o.value = ''; }
              else if (a === 'copy') copyText($o.value);
            });
          }
        };
      },

      /* ---------- Unicode ---------- */
      unicode() {
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">Unicode 编解码</h1>
              <p class="tool-desc">中文与 <code>\\uXXXX</code> 转义互转。</p>
            </div>
            <div class="row">
              <div class="panel">
                <div class="panel-title">原文</div>
                <textarea class="textarea mono" id="uin" placeholder="输入中文…">你好,世界</textarea>
                <div class="btn-row">
                  <button class="btn btn-primary" data-act="enc">转 \\uXXXX →</button>
                  <button class="btn" data-act="clear">清空</button>
                </div>
              </div>
              <div class="panel">
                <div class="panel-title">转义</div>

      /* ---------- Diff ---------- */
      diff() {
        // 简易 LCS diff
        const compute = (a, b) => {
          const al = a.split('\n'), bl = b.split('\n');
          const m = al.length, n = bl.length;
          const dp = Array.from({ length: m + 1 }, () => new Uint32Array(n + 1));
          for (let i = 1; i <= m; i++)
            for (let j = 1; j <= n; j++)
              dp[i][j] = al[i-1] === bl[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
          const out = [];
          let i = m, j = n;
          while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && al[i-1] === bl[j-1]) { out.unshift({ t: 'same', v: al[i-1] }); i--; j--; }
            else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) { out.unshift({ t: 'add', v: bl[j-1] }); j--; }
            else { out.unshift({ t: 'del', v: al[i-1] }); i--; }
          }
          return out;
        };
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">文本 Diff</h1>
              <p class="tool-desc">逐行比较两段文本的差异（基于 LCS）。</p>
            </div>
            <div class="diff-container">
              <textarea class="textarea mono" id="da" style="min-height:240px;">function hello() {
  console.log("hello");
  return 1;
}</textarea>
              <textarea class="textarea mono" id="db" style="min-height:240px;">function hello(name) {
  console.log("hello, " + name);
  return 0;
}</textarea>
            </div>
            <div class="btn-row">
              <button class="btn btn-primary" data-act="diff">比较</button>
              <button class="btn" data-act="swap">↕ 交换</button>
              <button class="btn" data-act="clear">清空</button>

            <div class="panel" style="margin-top:16px;">
              <div class="panel-title">差异</div>
              <div class="diff-pane" id="dout"></div>
            </div>
          `,
          bind(root) {
            const render = (res) => {
              const html = res.map(r => {
                const cls = r.t === 'add' ? 'add' : r.t === 'del' ? 'del' : 'same';
                const prefix = r.t === 'add' ? '+ ' : r.t === 'del' ? '- ' : '  ';
                return `<div class="diff-line ${cls}">${prefix}${escapeHtml(r.v) || ' '}</div>`;
              }).join('');
              root.querySelector('#dout').innerHTML = html || '<div class="diff-line same">没有差异</div>';
            };
            root.addEventListener('click', e => {
              const a = e.target.dataset.act;
              if (a === 'diff') render(compute(root.querySelector('#da').value, root.querySelector('#db').value));
              else if (a === 'swap') {
                const da = root.querySelector('#da'), db = root.querySelector('#db');
                [da.value, db.value] = [db.value, da.value];
              } else if (a === 'clear') { root.querySelector('#da').value = ''; root.querySelector('#db').value = ''; root.querySelector('#dout').innerHTML = ''; }
            });
          }
        };
      },

      /* ---------- UUID ---------- */
      uuid() {
        const gen = () => {
          if (crypto.randomUUID) return crypto.randomUUID();
          const b = crypto.getRandomValues(new Uint8Array(16));
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          const h = [...b].map(x => x.toString(16).padStart(2, '0'));
          return `${h.slice(0,4).join('')}-${h.slice(4,6).join('')}-${h.slice(6,8).join('')}-${h.slice(8,10).join('')}-${h.slice(10,16).join('')}`;

      /* ---------- Password ---------- */
      password() {
        const SETS = {
          lower: { ch: 'abcdefghijklmnopqrstuvwxyz', label: '小写字母 a-z' },
          upper: { ch: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', label: '大写字母 A-Z' },
          digit: { ch: '0123456789', label: '数字 0-9' },
          sym:   { ch: '!@#$%^&*()-_=+[]{};:,.<>?/', label: '特殊符号' },
          noAmbiguous: { ch: 'Il1O0', label: '排除易混字符' },
        };
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">随机密码生成</h1>

                </div>
                <div class="field">
                  <label class="switch">

                  </label>
                </div>

                </div>

                <div class="panel-title">结果</div>

                  <span class="tag" id="pwstrength"></span>
                </div>

                  <button class="btn" data-act="copy">复制</button>

          bind(root) {

            $len.addEventListener('input', () => $l.textContent = $len.value);
            const $o = root.querySelector('#pwout');
            const $strength = root.querySelector('#pwstrength');
            const getSets = () => {
              const chips = [...root.querySelectorAll('#pwcset .chip')];
              return chips.filter(c => {
                const checked = c.querySelector('input').checked;
                c.classList.toggle('active', checked);
                return checked;
              }).map(c => c.dataset.k);
            };
            const strength = (p) => {
              let s = 0;
              if (p.length >= 8) s++;
              if (p.length >= 12) s++;
              if (p.length >= 16) s++;
              if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
              if (/\d/.test(p)) s++;
              if (/[^a-zA-Z0-9]/.test(p)) s++;
              if (s <= 2) return ['弱', 'var(--danger)'];
              if (s <= 4) return ['中', 'var(--warning)'];
              return ['强', 'var(--success)'];
            };
            const genOne = (len, sets) => {
              const ambiguous = new Set(SETS.noAmbiguous.ch);
              const pools = sets.filter(s => s !== 'noAmbiguous').map(s => SETS[s].ch);
              const exclude = sets.includes('noAmbiguous');
              const all = pools.join('');
              const out = new Uint8Array(len);
              crypto.getRandomValues(out);
              let pw = '';
              for (let i = 0; i < len; i++) {
                let c;
                do { c = all[out[i] % all.length]; } while (exclude && ambiguous.has(c));
                pw += c;
              }
              // 保证每类至少一个
              if (root.querySelector('#pwrequire').checked) {
                const positions = new Uint8Array(pools.length);
                crypto.getRandomValues(positions);
                pools.forEach((pool, i) => {
                  let c;
                  do { c = pool[positions[i] % pool.length]; } while (exclude && ambiguous.has(c));
                  const pos = positions[i] % len;
                  pw = pw.slice(0, pos) + c + pw.slice(pos + 1);
                });
              }
              return pw;
            };
            const render = () => {
              const sets = getSets();
              if (sets.filter(s => s !== 'noAmbiguous').length === 0) { toast('至少选一个字符集'); return; }
              const n = Math.min(20, Math.max(1, +root.querySelector('#pwnum').value || 1));
              const len = +$len.value;
              const list = Array.from({ length: n }, () => genOne(len, sets));
              $o.value = list.join('\n');
              const [label, color] = strength(list[0] || '');
              $strength.textContent = '强度：' + label;
              $strength.style.background = color + '22';
              $strength.style.color = color;
            };
            root.addEventListener('click', e => {
              const a = e.target.dataset.act;
              if (a === 'gen') render();
              else if (a === 'copy') copyText($o.value);
              else if (a === 'clear') $o.value = '';
            });
            render();
          }
        };
      },

      /* ---------- Color ---------- */
      color() {
        const hex2rgb = (h) => {
          h = h.replace('#', '');
          if (h.length === 3) h = h.split('').map(c => c + c).join('');
          if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
          return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
        };
        const rgb2hex = ([r,g,b]) => '#' + [r,g,b].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
        const rgb2hsl = ([r,g,b]) => {
          r/=255; g/=255; b/=255;
          const max = Math.max(r,g,b), min = Math.min(r,g,b);
          let h, s, l = (max+min)/2;
          if (max === min) { h = s = 0; }
          else {
            const d = max - min;
            s = l > 0.5 ? d/(2-max-min) : d/(max+min);
            switch(max) {
              case r: h = (g-b)/d + (g<b?6:0); break;
              case g: h = (b-r)/d + 2; break;
              case b: h = (r-g)/d + 4; break;
            }
            h *= 60;
          }
          return [Math.round(h), Math.round(s*100), Math.round(l*100)];
        };
        const hsl2rgb = ([h,s,l]) => {
          s/=100; l/=100;
          const c = (1 - Math.abs(2*l - 1)) * s;
          const x = c * (1 - Math.abs((h/60) % 2 - 1));
          const m = l - c/2;
          let r=0,g=0,b=0;
          if (h < 60) [r,g,b] = [c,x,0];
          else if (h < 120) [r,g,b] = [x,c,0];
          else if (h < 180) [r,g,b] = [0,c,x];
          else if (h < 240) [r,g,b] = [0,x,c];
          else if (h < 300) [r,g,b] = [x,0,c];
          else [r,g,b] = [c,0,x];
          return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
        };
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">颜色值转换</h1>
              <p class="tool-desc">HEX / RGB / HSL 互转，附带色板预览。</p>
            </div>

              <div class="row-3">
                <div class="field">
                  <label class="field-label">HEX</label>
                  <div style="display:flex;gap:8px;">
                    <input class="input mono" id="chex" value="#1677ff" style="flex:1;" />
                    <div class="color-swatch" id="cswatch"></div>
                  </div>
                </div>
                <div class="field">
                  <label class="field-label">RGB</label>
                  <input class="input mono" id="crgb" value="rgb(22, 119, 255)" />
                </div>
                <div class="field">
                  <label class="field-label">HSL</label>
                  <input class="input mono" id="chsl" value="hsl(217, 100%, 54%)" />
                </div>
              </div>
              <div class="btn-row">
                <button class="btn" data-act="random">随机颜色</button>
                <button class="btn" data-act="copy-hex">复制 HEX</button>
                <button class="btn" data-act="copy-rgb">复制 RGB</button>
                <button class="btn" data-act="copy-hsl">复制 HSL</button>
              </div>
            </div>
            <div class="panel">
              <div class="panel-title">色板</div>
              <div id="cpal" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;"></div>
            </div>
          `,
          bind(root) {
            const $hex = root.querySelector('#chex');
            const $rgb = root.querySelector('#crgb');
            const $hsl = root.querySelector('#chsl');
            const $sw = root.querySelector('#cswatch');
            const PALETTE = [
              '#1677ff','#722ed1','#eb2f96','#f5222d','#fa8c16',
              '#faad14','#a0d911','#52c41a','#13c2c2','#1890ff',
              '#000000','#ffffff','#8c8c8c','#595959','#262626',
              '#ffc1cc','#b5ead7','#c7ceea','#ffdac1','#ff9aa2'
            ];
            const $pal = root.querySelector('#cpal');
            $pal.innerHTML = PALETTE.map(c => `<div class="ascii-cell" data-c="${c}" style="background:${c};color:${parseInt(c.slice(1),16) > 0xaaaaaa ? '#000' : '#fff'};">
              <div class="char" style="color:inherit;">${c.toUpperCase()}</div>
            </div>`).join('');
            const update = (rgb) => {
              if (!rgb || rgb.some(v => isNaN(v))) return;
              const hex = rgb2hex(rgb);
              const [h,s,l] = rgb2hsl(rgb);
              $hex.value = hex;
              $rgb.value = `rgb(${rgb.join(', ')})`;
              $hsl.value = `hsl(${h}, ${s}%, ${l}%)`;
              $sw.style.background = hex;
            };
            const fromHex = () => {
              const rgb = hex2rgb($hex.value);
              if (rgb) update(rgb); else toast('无效的 HEX');
            };
            const fromRgb = () => {
              const m = $rgb.value.match(/(\d+)\D+(\d+)\D+(\d+)/);
              if (m) update([+m[1], +m[2], +m[3]]); else toast('无效的 RGB');
            };
            const fromHsl = () => {
              const m = $hsl.value.match(/(\d+)\D+(\d+)%?\D+(\d+)%?/);
              if (m) update(hsl2rgb([+m[1], +m[2], +m[3]])); else toast('无效的 HSL');
            };
            $hex.addEventListener('change', fromHex);
            $rgb.addEventListener('change', fromRgb);
            $hsl.addEventListener('change', fromHsl);
            $pal.addEventListener('click', e => {
              const c = e.target.closest('[data-c]');

            root.addEventListener('click', e => {

      /* ---------- Radix ---------- */
      radix() {
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">进制转换</h1>
              <p class="tool-desc">2 ~ 36 进制互转，支持小数。</p>
            </div>
            <div class="panel">
              <div class="row-3">
                <div class="field" style="grid-column:1 / -1;">
                  <label class="field-label">输入数字</label>
                  <input class="input mono" id="rval" value="255" />
                </div>
                <div class="field">
                  <label class="field-label">输入进制</label>
                  <input class="input" type="number" id="rfrom" value="10" min="2" max="36" />
                </div>
                <div class="field">
                  <label class="field-label">目标进制</label>
                  <input class="input" type="number" id="rto" value="16" min="2" max="36" />
                </div>
                <div class="field" style="display:flex;align-items:flex-end;">
                  <button class="btn btn-primary" data-act="conv" style="width:100%;">转换</button>
                </div>
              </div>
            </div>
            <div class="panel">
              <div class="panel-title">结果（自动展示 2/8/10/16）</div>
              <div class="output" id="rout"></div>
              <div class="btn-row">
                <button class="btn" data-act="copy">复制当前</button>
              </div>
            </div>
          `,
          bind(root) {
            const $v = root.querySelector('#rval');
            const $from = root.querySelector('#rfrom');
            const $to = root.querySelector('#rto');
            const $o = root.querySelector('#rout');
            const render = () => {
              const val = $v.value.trim();
              const f = +$from.value, t = +$to.value;
              if (!val) { $o.textContent = ''; return; }
              try {
                // 小数处理
                const [int, frac] = val.split('.');
                const decInt = parseInt(int || '0', f);
                if (isNaN(decInt)) throw new Error('无效输入');
                let decFrac = 0;
                if (frac) {
                  decFrac = frac.split('').reduce((acc, c) => {
                    const d = parseInt(c, f);
                    if (isNaN(d)) throw new Error('无效字符');
                    return acc * f + d;
                  }, 0) / Math.pow(f, frac.length);
                }
                const dec = decInt + decFrac;
                const toBase = (n, b) => {
                  if (n === 0) return '0';
                  const digits = '0123456789abcdefghijklmnopqrstuvwxyz';
                  let out = '';
                  let v = Math.floor(n);
                  while (v > 0) { out = digits[v % b] + out; v = Math.floor(v / b); }
                  if (n !== Math.floor(n)) {
                    let f = n - Math.floor(n);
                    out += '.';
                    for (let i = 0; i < 10 && f > 0; i++) {
                      f *= b;
                      out += digits[Math.floor(f)];
                      f -= Math.floor(f);
                    }
                  }
                  return out;
                };
                const lines = [
                  `BIN (2):  ${toBase(dec, 2)}`,
                  `OCT (8):  ${toBase(dec, 8)}`,
                  `DEC (10): ${toBase(dec, 10)}`,
                  `HEX (16): ${toBase(dec, 16)}`,
                  '',
                  `目标 (${t}): ${toBase(dec, t)}`,
                ];
                $o.textContent = lines.join('\n');
              } catch (e) { $o.textContent = '错误：' + e.message; }
            };
            $v.addEventListener('input', render);
            $from.addEventListener('input', render);
            $to.addEventListener('input', render);
            root.addEventListener('click', e => {
              if (e.target.dataset.act === 'copy') copyText($o.textContent);
            });
            render();
          }
        };
      },

      /* ---------- Cron ---------- */
      cron() {
        // 计算下次执行
        const next = (expr, count = 5) => {
          const parts = expr.trim().split(/\s+/);
          if (parts.length !== 5 && parts.length !== 6) throw new Error('需要 5 或 6 段（分 时 日 月 周 [年]）');
          const [m, h, d, mo, w] = parts;
          const results = [];
          let t = new Date();
          t.setSeconds(0, 0);
          t.setMinutes(t.getMinutes() + 1);
          let safety = 0;
          while (results.length < count && safety < 366 * 24 * 60 * 5) {
            safety++;
            const mm = t.getMinutes(), hh = t.getHours(), dd = t.getDate(), mmm = t.getMonth() + 1, ww = t.getDay();
            if (match(m, mm) && match(h, hh) && match(d, dd) && match(mo, mmm) && match(w, ww)) {
              results.push(new Date(t));
            }
            t.setMinutes(t.getMinutes() + 1);
          }
          return results;
        };
        const match = (field, v) => {
          if (field === '*') return true;
          for (const seg of field.split(',')) {
            const [_, step = 1] = seg.split('/');
            if (seg === '*') return true;
            if (seg.includes('-')) {
              const [a, b] = seg.split('-');
              if (v >= +a && v <= +b) return true;
            } else if (seg.includes('/')) {
              const base = seg.split('/')[0];
              if (base === '*') return v % step === 0;
              if (v >= +base && (v - +base) % step === 0) return true;
            } else if (+seg === v) return true;
          }
          return false;
        };
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">Cron 表达式解析</h1>
              <p class="tool-desc">展示未来 5 次执行时间。支持 5 段（标准）和 6 段（含年）。</p>
            </div>
            <div class="panel">
              <div class="field">
                <label class="field-label">Cron 表达式</label>
                <input class="input mono" id="cexp" value="*/5 * * * *" />
              </div>
              <div class="field">
                <label class="field-label">说明</label>
                <div id="cexpdesc" class="output">—</div>
              </div>
              <div class="btn-row">
                <button class="btn" data-act="preset1">每分钟</button>
                <button class="btn" data-act="preset2">每 5 分钟</button>
                <button class="btn" data-act="preset3">每小时</button>
                <button class="btn" data-act="preset4">每天 0 点</button>
                <button class="btn" data-act="preset5">每周一 9 点</button>
                <button class="btn" data-act="preset6">每月 1 号</button>
              </div>
            </div>
            <div class="panel">
              <div class="panel-title">未来 5 次执行</div>
              <div id="cnext" class="output" style="min-height:160px;">—</div>
            </div>
          `,
          bind(root) {
            const $e = root.querySelector('#cexp');
            const $d = root.querySelector('#cexpdesc');
            const $n = root.querySelector('#cnext');
            const DESCS = [
              { p: ['*/5 * * * *', '每 5 分钟'] },
            ];
            const descFor = (e) => {
              const presets = {
                '* * * * *': '每分钟',
                '*/5 * * * *': '每 5 分钟',
                '0 * * * *': '每小时',
                '0 0 * * *': '每天 0 点',
                '0 9 * * 1': '每周一 9 点',
                '0 0 1 * *': '每月 1 号 0 点',
              };
              return presets[e] || '自定义表达式';
            };
            const render = () => {
              $d.textContent = descFor($e.value.trim());
              try {
                const list = next($e.value, 5);
                $n.textContent = list.length
                  ? list.map((d, i) => `#${i+1}  ${formatDate(d, 'YYYY-MM-DD HH:mm')}  (${['日','一','二','三','四','五','六'][d.getDay()]})`).join('\n')
                  : '— 未匹配到执行时间 —';
              } catch (e) { $n.textContent = '错误：' + e.message; }
            };
            $e.addEventListener('input', render);
            root.addEventListener('click', e => {
              const a = e.target.dataset.act;
              const presets = {
                preset1: '* * * * *',
                preset2: '*/5 * * * *',
                preset3: '0 * * * *',
                preset4: '0 0 * * *',
                preset5: '0 9 * * 1',
                preset6: '0 0 1 * *',
              };
              if (presets[a]) { $e.value = presets[a]; render(); }
            });
            render();
          }
        };
      },

      /* ---------- ASCII ---------- */
      ascii() {
        return {
          view: () => `
            <div class="tool-header">
              <h1 class="tool-title">ASCII / Unicode 表</h1>
              <p class="tool-desc">点击单元格复制字符。</p>
            </div>
            <div class="panel">
              <div class="field">
                <label class="field-label">字符 → 编码</label>
                <input class="input" id="achar" placeholder="输入字符…" maxlength="10" />
              </div>
              <div class="output" id="ainfo">—</div>
            </div>
            <div class="panel">
              <div class="panel-title">ASCII (32–126)</div>
              <div class="ascii-grid" id="aascii"></div>
            </div>
            <div class="panel">
              <div class="panel-title">中文 Unicode 常用区 (0x4E00–0x4EFF)</div>
              <div class="ascii-grid" id="acjk" style="max-height:300px;"></div>
            </div>
          `,
          bind(root) {
            const render = () => {
              const ch = root.querySelector('#achar').value;
              if (!ch) { root.querySelector('#ainfo').textContent = '—'; return; }
              const list = [...ch].map(c => {
                const code = c.codePointAt(0);
                return `${escapeHtml(c)}  →  U+${code.toString(16).toUpperCase().padStart(4,'0')}  (${code})  UTF-8: ${[...new TextEncoder().encode(c)].map(b => b.toString(16).padStart(2,'0')).join(' ')}`;
              });
              root.querySelector('#ainfo').textContent = list.join('\n');
            };
            root.querySelector('#achar').addEventListener('input', render);
            const cell = (ch, code) => `<div class="ascii-cell" data-ch="${escapeAttr(ch)}">
              <div class="char">${escapeHtml(ch)}</div>
              <div class="code">${code > 0xFF ? 'U+' + code.toString(16).toUpperCase().padStart(4,'0') : code}</div>
            </div>`;
            const a = root.querySelector('#aascii');
            for (let i = 32; i <= 126; i++) a.insertAdjacentHTML('beforeend', cell(String.fromCharCode(i), i));
            const c = root.querySelector('#acjk');
            for (let i = 0x4E00; i <= 0x4EFF; i++) c.insertAdjacentHTML('beforeend', cell(String.fromCodePoint(i), i));
            document.addEventListener('click', e => {
              const t = e.target.closest('.ascii-cell');
              if (t) { copyText(t.dataset.ch); toast('已复制：' + t.dataset.ch); }
            });
            render();
          }
        };
      },
    };

    /* ============================================================
       通用辅助
       ============================================================ */
    function pad(n, w = 2) { return String(n).padStart(w, '0'); }
    function formatDate(d, fmt) {
      const map = {
        YYYY: d.getFullYear(),
        MM: pad(d.getMonth() + 1),
        DD: pad(d.getDate()),
        HH: pad(d.getHours()),
        mm: pad(d.getMinutes()),
        ss: pad(d.getSeconds()),
        dddd: ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()],
      };
      return fmt.replace(/YYYY|MM|DD|HH|mm|ss|dddd/g, k => map[k]);
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }
    function copyText(t) {
      if (!t) { toast('内容为空'); return; }
      navigator.clipboard.writeText(t).then(() => toast('已复制')).catch(() => {
        const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('已复制');
      });
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.innerHTML = ICONS.check + '<span>' + escapeHtml(msg) + '</span>';
      t.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove('show'), 1500);
    }

    /* ============================================================
       路由
       ============================================================ */
    const state = { toolId: null, instance: null };

    function renderNav(filter = '') {
      const f = filter.trim().toLowerCase();
      const groups = {};
      TOOLS.forEach(t => {
        if (f && !t.name.toLowerCase().includes(f) && !t.desc.toLowerCase().includes(f)) return;
        (groups[t.group] = groups[t.group] || []).push(t);
      });
      const html = Object.entries(groups).map(([g, list]) => `
        <div class="nav-group">
          <div class="nav-group-title">${g}</div>
          ${list.map(t => `
            <a class="nav-item ${t.id === state.toolId ? 'active' : ''}" data-id="${t.id}" href="#/${t.id}">
              ${ICONS[t.icon] || ''}
              <span>${t.name}</span>
            </a>
          `).join('')}
        </div>
      `).join('');
      document.getElementById('navList').innerHTML = html || '<div style="padding:12px;color:var(--text-muted);text-align:center;font-size:13px;">无匹配结果</div>';
    }

    function homeView() {
      return `
        <div class="tool-header">
          <h1 class="tool-title">👋 欢迎使用 Wake Tools</h1>
          <p class="tool-desc">为开发者准备的小工具集合。${TOOLS.length} 个工具，浏览器本地运行，数据不上传。</p>
        </div>
        <div class="home-grid">
          ${TOOLS.map(t => `
            <a class="home-card" href="#/${t.id}">
              <div class="home-card-icon">${ICONS[t.icon] || ''}</div>
              <h3>${t.name}</h3>
              <p>${t.desc}</p>
              <svg class="home-card-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          `).join('')}
        </div>
      `;
    }

    function render() {
      const hash = location.hash.replace(/^#\/?/, '');
      const tool = TOOLS.find(t => t.id === hash);
      const panel = document.getElementById('panel');
      if (!tool) {
        state.toolId = null;
        document.getElementById('breadcrumb').innerHTML = '首页';
        panel.innerHTML = homeView();
      } else {
        state.toolId = tool.id;
        document.getElementById('breadcrumb').innerHTML = `${tool.group} <span class="crumb-sep">/</span> <strong>${tool.name}</strong>`;
        const factory = Tools[tool.id]();
        panel.innerHTML = factory.view();
        factory.bind(panel);
        // 替换工具页里的 emoji title 为带图标的版本
        const titleEl = panel.querySelector('.tool-title');
        if (titleEl && ICONS[tool.icon]) {
          const iconHtml = `<span class="tool-title-icon">${ICONS[tool.icon]}</span>`;
          titleEl.innerHTML = iconHtml + '<span>' + titleEl.innerHTML + '</span>';
        }
      }
      renderNav(document.getElementById('search').value);
      // 移动端自动关闭抽屉
      if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
    }

    /* ============================================================
       初始化
       ============================================================ */
    document.getElementById('search').addEventListener('input', e => renderNav(e.target.value));

    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // 主题
    const stored = localStorage.getItem('wt-theme');
    if (stored) document.documentElement.setAttribute('data-theme', stored);
    const updateThemeIcon = () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const icon = document.getElementById('themeIcon');
      // 暗色时显示太阳（点击回到亮色），亮色时显示月亮（点击去暗色）
      icon.innerHTML = cur === 'dark'
        ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
        : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    };
    updateThemeIcon();
    document.getElementById('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('wt-theme', next);
      updateThemeIcon();
    });

    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
