<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="bt bd" text-rendering="geometricPrecision">
  <title id="bt">Wake Tools</title>
  <desc id="bd">Wake Tools — a grab-and-go toolbox for developers. 31 tools across 9 categories, running entirely in the browser on vanilla JS and Cloudflare Workers.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a0033"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect x="742" y="0" width="538" height="320" fill="url(#glow)"/>

  <!-- ── left: identity ─────────────────────────────────────────── -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="92" fill="#c4b5fd" font-size="15" font-weight="500" letter-spacing="0.6"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">~/ wake-tools &#8250;</text>

    <text x="80" y="172" fill="#ffffff" font-size="62" font-weight="700" letter-spacing="-1.5">Wake Tools</text>

    <rect x="80" y="196" width="72" height="3" rx="1.5" fill="#a78bfa">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <text x="80" y="242" fill="#ddd6fe" font-size="15" font-weight="500" letter-spacing="0.4"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">Vanilla JS &#183; Service Worker &#183; Cloudflare Workers</text>
  </g>

  <!-- ── right: live terminal ───────────────────────────────────── -->
  <g>
    <rect x="830" y="42" width="390" height="236" rx="12" fill="#0a0416" fill-opacity="0.78"
          stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="7 5">
      <animate attributeName="stroke-dashoffset" values="0;12" dur="1.6s" repeatCount="indefinite"/>
    </rect>

    <text x="852" y="68" fill="#c4b5fd" font-size="13" letter-spacing="0.3"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">~/ wake-tools</text>

    <!-- separator with a light sweep running along it -->
    <rect x="852" y="83" width="346" height="1" fill="#a78bfa" opacity="0.28"/>
    <rect x="852" y="83" width="64" height="1" fill="#ede9fe" opacity="0">
      <animate attributeName="x" values="852;1134" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.16;0.84;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <text x="852" y="118" fill="#8b5cf6" font-size="15"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">$</text>
    <text x="872" y="118" fill="#ede9fe" font-size="15"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">list --all</text>

    <text x="852" y="143" fill="#a78bfa" font-size="13"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">31 tools &#183; 9 categories</text>

    <!-- category histogram: one bar per category, a light wave travels across -->
    <g fill="#c4b5fd">
      <rect x="872" y="177" width="20" height="55" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="908" y="210" width="20" height="22" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="944" y="166" width="20" height="66" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></rect>
      <rect x="980" y="188" width="20" height="44" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></rect>
      <rect x="1016" y="166" width="20" height="66" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="1.6s" repeatCount="indefinite"/></rect>
      <rect x="1052" y="221" width="20" height="11" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="2s" repeatCount="indefinite"/></rect>
      <rect x="1088" y="210" width="20" height="22" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></rect>
      <rect x="1124" y="199" width="20" height="33" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="2.8s" repeatCount="indefinite"/></rect>
      <rect x="1160" y="210" width="20" height="22" rx="3" opacity="0.45"><animate attributeName="opacity" values="0.45;1;0.45" dur="3.6s" begin="3.2s" repeatCount="indefinite"/></rect>
    </g>

    <!-- prompt + blinking cursor -->
    <text x="852" y="262" fill="#8b5cf6" font-size="14"
          font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">&gt;</text>
    <rect x="870" y="250" width="9" height="16" rx="1.5" fill="#ede9fe">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
